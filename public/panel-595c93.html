<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Admin</title>
<style>
body{font:16px/1.6 system-ui,sans-serif;background:#0f1317;color:#e8e1d0;margin:0;padding:20px;max-width:760px;margin-inline:auto}
input,button{font:inherit;padding:10px;border-radius:6px;border:1px solid #2c353f;background:#1a2027;color:#e8e1d0;box-sizing:border-box}
input{width:100%;margin:6px 0}button{cursor:pointer}.go{background:#e2b04a;color:#1a1405;font-weight:700}.red{background:#b5443f;border-color:#b5443f;color:#fff}
.room{border:1px solid #2c353f;border-radius:8px;padding:12px;margin:10px 0}.dim{color:#7c8590}.bad{color:#ff7b72}.row{display:flex;gap:8px;align-items:center}.row input{flex:1}
</style></head><body>
<h2>Admin</h2>
<div id="login">
  <p class="dim">Enter the admin password.</p>
  <input id="key" type="password" autocomplete="off" placeholder="Admin password">
  <button class="go" id="go" style="width:100%">Enter</button>
  <p id="msg" class="bad"></p>
</div>
<div id="panel" hidden>
  <div class="row"><b id="count"></b><span style="flex:1"></span><button id="refresh">Refresh</button><button class="red" id="all">Close ALL rooms</button></div>
  <div class="row" style="margin-top:10px"><input id="say" maxlength="200" placeholder="Announcement to every player"><button id="send">Send</button></div>
  <div id="rooms"></div>
  <p class="dim">Updates every 5 seconds. The password stays in this page's memory only; closing the tab forgets it.</p>
</div>
<script>
let KEY = "", timer;
const $ = id => document.getElementById(id);
async function api(path, body) {
  const r = await fetch("/admin-api/" + path, { method: "POST", headers: { "Content-Type": "application/json", "x-admin-key": KEY }, body: JSON.stringify(body || {}) });
  if (r.status == 200) return r.json();
  throw new Error(r.status == 403 ? "Wrong password." : r.status == 429 ? "Too many wrong tries. Wait 15 minutes." : "Admin is not enabled on this server.");
}
async function load() {
  const d = await api("rooms"), box = $("rooms"); box.textContent = "";
  $("count").textContent = d.rooms.length + " room(s)";
  d.rooms.forEach(r => {
    const el = document.createElement("div"); el.className = "room";
    const head = document.createElement("div"); head.className = "row";
    const t = document.createElement("b"); t.textContent = r.code + " · " + r.phase + (r.night ? " · night " + r.night : "");
    const sp = document.createElement("span"); sp.style.flex = "1";
    const b = document.createElement("button"); b.className = "red"; b.textContent = "Close room";
    b.onclick = async () => { if (confirm("Close room " + r.code + " and disconnect its players?")) { await api("close", { code: r.code }); load(); } };
    head.append(t, sp, b);
    const info = document.createElement("div"); info.className = "dim";
    info.textContent = "Host: " + (r.host || "?") + " · started " + Math.round((Date.now() - r.created) / 60000) + " min ago · " + r.players.map(p => p.n + (p.on ? "" : " (offline)") + (p.a ? "" : " ✝")).join(", ");
    el.append(head, info); box.append(el);
  });
}
$("go").onclick = async () => {
  KEY = $("key").value; $("msg").textContent = "";
  try { await load(); $("login").hidden = true; $("panel").hidden = false; timer = setInterval(() => load().catch(() => {}), 5000); }
  catch (e) { $("msg").textContent = e.message; KEY = ""; }
};
$("key").onkeydown = e => { if (e.key == "Enter") $("go").click(); };
$("refresh").onclick = () => load();
$("all").onclick = async () => { if (confirm("Close EVERY room and disconnect all players?")) { const r = await api("closeall"); alert("Closed " + r.n + " room(s)."); load(); } };
$("send").onclick = async () => { const text = $("say").value.trim(); if (text) { await api("say", { text }); $("say").value = ""; } };
</script></body></html>
