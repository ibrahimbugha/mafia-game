/* ===== visual polish v2 ===== */

const sonLn = (s, nm) => (s || []).map(([a, b]) => `<br>👦 ${nm(a)} أخذ معه ${nm(b)}`).join("");
const vlHtml = (v, nm) => (v && v.length) ? `<h3>تفصيل التصويت</h3><div class="vl">${v.map(x => `<p>${nm(x.f)} ← ${x.t >= 0 ? "<b>" + nm(x.t) + "</b>" : "امتنع"}${x.w > 1 ? " ×" + x.w : ""}</p>`).join("")}</div>` : "";
function tlHtml(log, nm) { /* scrollable end-of-game timeline of every hidden action */
  if (!log || !log.length) return "";
  const body = log.map(e => e.k == "n"
    ? `<p><span class="h">الليلة ${e.n}</span><br>${e.acts.length ? e.acts.map(a => `${ROLES[a.r].n} (${nm(a.f)}) ${VERB[a.t] || ""} <b>${nm(a.to)}</b>${a.t == "investigate" ? (a.m ? " ← من المافيا" : " ← ليس من المافيا") : ""}`).join("<br>") : "لم يتحرك أحد"}<br>${e.dead.length ? "💀 " + e.dead.map(nm).join("، ") : "لم يمت أحد"}${e.sil >= 0 ? ` · 🤐 ${nm(e.sil)}` : ""}${sonLn(e.sons, nm)}</p>`
    : `<p><span class="h">تصويت اليوم ${e.n}</span><br>${(e.votes || []).map(v => nm(v.f) + " ← " + (v.t >= 0 ? nm(v.t) : "امتنع") + (v.w > 1 ? " ×" + v.w : "")).join("<br>")}<br>${e.ex >= 0 ? "⚖️ أُعدم " + nm(e.ex) : "لا إعدام"}${sonLn(e.sons, nm)}</p>`).join("");
  return `<h3>ملخص اللعبة</h3><div class="tl">${body}</div>`;
}
const SDTXT = { mafia: "أنت من المافيا.", good: "أنت من أهل المدينة.", neutral: "أنت محايد: تفوز إذا صوّتت المدينة لإعدامك." };
const roleCard = (id, sd, n, desc) => { const ic = (String(n).match(/^\S+/) || ["🎭"])[0], nm = String(n).replace(/^\S+\s*/, "");
  return `<p class="dim c">اضغط على البطاقة لكشف دورك</p><div class="flip" onclick="this.classList.toggle('flipped')"><div class="fin"><div class="face back"><div class="sig">☪</div></div><div class="face front ${sd}"><div class="aura"></div><img class="art" src="roles/${id}.webp" alt="" onerror="this.remove()"><div class="ico">${ic}</div><h2>${nm}</h2><p class="sd">${SDTXT[sd]}</p><p class="dim">${desc || ""}</p></div></div></div>`; };
const hue = n => { let h = 0; for (const c of String(n)) h = (h * 31 + c.codePointAt(0)) % 360; return h; };
const ini = n => Array.from(String(n).replace(/&[a-z#0-9]+;/gi, "?").trim())[0] || "?";
const pat = n => ` data-i="${ini(n)}" style="--h:${hue(n)}"`;
const pbtn = (name, fn, cls = "") => btn(name, fn, ("pc " + cls).trim()).replace(/(<button class="[^"]*")/, (m) => m + pat(name));
const tgtBtn = (x, a, fn) => a.noRepeat && x === G.last[a.type] ? `<button class="btn pc off" disabled${pat(x.name)}>${x.name} (${a.type == "guard" ? "حُمي" : "أُنقذ"} الليلة الماضية)</button>`
  : a.type == "kill" && side(x) == "mafia" ? `<button class="btn pc foe" disabled${pat(x.name)}>${x.name} — ${ROLES[x.role].n} (زميلك)</button>` : pbtn(x.name, fn);
const deathLine = (n, cs, nm) => { /* cause of death sentence */
  if (PREF.lang == "en") {
    if (!cs || !cs.length) return `<b>${n}</b> was killed.`;
    const g = c => c.c == "kill" ? `by ${ROLES[c.by].n}` : c.c == "snipe" ? "by the Sniper's bullet" : c.c == "guard" ? `while protecting <b>${nm(c.f)}</b> from ${ROLES[c.by].n}` : `after missing their target <b>${nm(c.f)}</b>`;
    return `${cs.some(c => c.c != "miss") ? `<b>${n}</b> was killed` : `The Sniper <b>${n}</b> died`} ${cs.map(g).join(" and ")}.`;
  }
  if (!cs || !cs.length) return `قُتل <b>${n}</b>.`;
  const f = c => c.c == "kill" ? `على يد ${ROLES[c.by].n}` : c.c == "snipe" ? "برصاصة القناص" : c.c == "guard" ? `وهو يحمي <b>${nm(c.f)}</b> من ${ROLES[c.by].n}` : `بعد أن أخطأ هدفه <b>${nm(c.f)}</b>`;
  return `${cs.some(c => c.c != "miss") ? "قُتل" : "مات القناص"} <b>${n}</b> ${cs.map(f).join(" و")}.`;
};
const btn = (label, fn, cls = "") => `<button class="btn ${cls}" onclick="${fn}">${label}</button>`;

/* ---------- setup ---------- */
function setup() {
  show(`<div class="icon">🕵️</div><h1><span class="flick">المافيا</span></h1><p class="dim">لعبة تمرير الهاتف. المدينة نائمة، وليس الجميع بريئًا.</p>
  <div class="row">${btn("−", "N=Math.max(5,N-1);setup()", "step")}<div class="big" style="flex:1">${N}</div>${btn("+", "N=Math.min(20,N+1);setup()", "step")}</div>
  <div>${Array.from({length:N}, (_, i) => `<input type="text" maxlength="14" placeholder="لاعب ${i+1}" value="${NAMES[i] || ""}" oninput="NAMES[${i}]=this.value">`).join("")}</div>
  ${btn("التالي: اختيار الشخصيات", "chooseRoles(true)", "go")}${btn("رجوع", "mode()")}`);
}
function guide() {
  const roles = s => Object.entries(ROLES).filter(([, r]) => r.side == s)
    .map(([id, r]) => `<div class="role ${s}"><b>${r.n}</b><p class="dim">${DESC[id] || ""}</p></div>`).join("");
  show(`<h1>دليل اللعبة</h1>
    <h3>الهدف</h3>
    <p>تفوز المدينة عندما يخرج كل أفراد المافيا من اللعبة. وتفوز المافيا عندما يتساوى عددها مع عدد أهل المدينة أو يزيد عليه. وإذا فني الطرفان معًا (كالابن المدلل يأخذ آخر مافيا معه) تكون النتيجة تعادلًا.</p>
    <h3>كيف تسير الجولة</h3>
    <p><b>الليل:</b> يمرَّر الهاتف على كل لاعب حي بترتيب المقاعد. كل لاعب يختار لاعبًا، حتى المواطن العادي، واختياره بلا أثر. هكذا لا يعرف أحد من صاحب القدرة.</p>
    <p><b>الفجر:</b> تُعلن النتائج: من قُتل ويُكشف دوره للجميع، ومن أُسكت.</p>
    <p><b>النقاش:</b> وقت محدد للكلام والاتهام والدفاع. من أُسكت لا يتكلم.</p>
    <p><b>التصويت:</b> كل لاعب يصوّت سرًّا بتمرير الهاتف. صاحب أعلى الأصوات يُعدم ويُكشف دوره. إذا تعادلت الأصوات فلا أحد يُعدم. الامتناع مسموح.</p>
    <h3>عدد اللاعبين</h3>
    <p>من 5 إلى 20 لاعبًا. يزيد عدد المافيا مع العدد (حوالي الربع)، وفي الألعاب الكبيرة يُضاف محقق وطبيب ثانٍ. إذا كان في المافيا أكثر من قاتل فالقتل يتم بالأغلبية، وعند التعادل يُختار أحد الأهداف عشوائيًا.</p>
    <h3>أهل المدينة</h3>${roles("good")}
    <h3>المافيا</h3>${roles("mafia")}
    <h3>محايد</h3>${roles("neutral")}
    <h3>قواعد مهمة</h3>
    <p>في بداية اللعبة يعرف أفراد المافيا بعضهم عند كشف الأدوار.</p>
    <p>عند موت أي لاعب، قتلًا أو إعدامًا، يُكشف دوره للجميع.</p>
    <p>المسكَّت يصوّت كالمعتاد لكنه لا يتكلم حتى نهاية ذلك النهار.</p>
    <h3>نصائح للعب</h3>
    <p>ضع الهاتف على الطاولة وسلّمه يدًا بيد. اضغط «أخفِ» قبل أن تمرّره، ولا تنظر إلى شاشة غيرك.</p>
    ${btn("رجوع", "menu()", "go")}`);
}
function start() {
  const tot = Object.values(SEL).reduce((a, b) => a + b, 0);
  if (tot > N) return chooseRoles();
  const roles = shuffle([...Object.entries(SEL).flatMap(([id, c]) => Array(c).fill(id)), ...Array(N - tot).fill("citizen")]);
  G = { p: roles.map((r, i) => ({ name: esc((NAMES[i] || "").trim() || "لاعب " + (i+1)), role: r, alive: true })),
        night: 0, last: {}, silenced: null, mayorUsed: false, log: [], cs: [], vlog: [] };
  reveal(0);
}

/* ---------- role reveal ---------- */
function reveal(i) {
  if (i >= G.p.length) return night();
  const p = G.p[i];
  pass(p, () => {
    const mates = G.p.filter(x => x !== p && side(x) == "mafia");
    show(`${roleCard(p.role, side(p), ROLES[p.role].n, DESC[p.role])}
      ${side(p) == "mafia" && mates.length ? `<p>رفيقك: <b>${mates.map(m => m.name).join("، ")}</b></p>` : ""}
      ${btn("أخفِ الدور ومرّر الهاتف", `reveal(${i+1})`)}`);
  });
}

/* ---------- night ---------- */
function night() {
  G.night++; G.acts = [];
  G.q = alive(); /* seating order */
  setPh("night"); sfx("night");
  show(`<div class="icon">🌙</div><h1>الليل ${G.night}</h1><p>تغلق المدينة عينيها. المافيا وحدها تعرف من يمشي في الظلام.</p>${btn("ابدأ الليل", "nstep(0)", "go")}`);
}
function nstep(i) {
  if (i >= G.q.length) return dawn();
  pass(G.q[i], () => {
    const p = G.q[i]; let a = ROLES[p.role].act || DECOY; if (a.once && p.used) a = DECOY;
    const ts = alive().filter(x => a.self || x !== p);
    show(`<h2>${ROLES[p.role].n}</h2><p>${isDual(p) ? "مات القاتل: ستسكت لاعبًا ثم تقتل لاعبًا. " : ""}${a.q}</p><div class="list">${ts.map(t => tgtBtn(t, a, `pick(${i},${idx(t)})`)).join("")}${a.skip ? btn("لن أطلق الليلة", `pick(${i},-1)`) : ""}</div>`);
  });
}
function pick(i, ti) {
  const p = G.q[i], t = G.p[ti]; let a = ROLES[p.role].act || DECOY; if (a.once && p.used) a = DECOY;
  if (t) { if (a.once) p.used = true; G.acts.push({ type: a.type, from: p, to: t }); }
  if (t && isDual(p) && a.type == "silence") { show(`<h2>${ROLES[p.role].n}</h2><p>ثانيًا: من تريد قتله؟</p><div class="list">${alive().filter(x => x !== p).map(x => tgtBtn(x, { type: "kill" }, `pick2(${i},${idx(x)})`)).join("")}</div>`); return; }
  const inv = a.type == "investigate"; sfx("knock");
  show(`<h2>${inv ? t.name : "تم"}</h2><p>${inv ? (side(t) == "mafia" ? '<b class="bad">من المافيا</b>' : "ليس من المافيا") : "تم تسجيل اختيارك."}</p>${btn("أخفِ الشاشة ومرّر الهاتف", `nstep(${i+1})`)}`);
}

function pick2(i, ti) {
  if (side(G.p[ti]) == "mafia") return; /* no friendly fire */
  G.acts.push({ type: "kill", from: G.q[i], to: G.p[ti] }); sfx("knock");
  show(`<h2>تم</h2><p>تم تسجيل اختيارك.</p>${btn("أخفِ الشاشة ومرّر الهاتف", `nstep(${i+1})`)}`);
}
/* ---------- dawn ---------- */
function dawn() {
  const A = G.acts, saved = A.filter(a => a.type == "save").map(a => a.to);
  const c = {}; A.filter(a => a.type == "kill").forEach(a => c[idx(a.to)] = (c[idx(a.to)] || 0) + 1);
  const mx = Math.max(0, ...Object.values(c)), top = Object.keys(c).filter(k => c[k] == mx);
  const tgt = top.length ? G.p[shuffle(top)[0]] : null;
  const gd = tgt && A.find(a => a.type == "guard" && a.to === tgt);
  const dead = tgt && !saved.includes(tgt) ? [gd ? gd.from : tgt] : [], why = {}, W = (p, o) => (why[idx(p)] = why[idx(p)] || []).push(o);
  if (dead.length) { const ka = A.find(a => a.type == "kill" && a.to === tgt), by = ka ? ka.from.role : "killer"; if (gd) W(gd.from, { c: "guard", f: idx(tgt), by }); else W(tgt, { c: "kill", by }); }
  G.last = {}; ["save", "guard"].forEach(k => G.last[k] = (A.find(a => a.type == k) || {}).to || null);
  A.filter(a => a.type == "snipe").forEach(a => { dead.push(a.to); W(a.to, { c: "snipe" }); if (side(a.to) != "mafia") { dead.push(a.from); W(a.from, { c: "miss", f: idx(a.to) }); } });
  dead.splice(0, dead.length, ...new Set(dead));
  const s = A.find(a => a.type == "silence"); G.silenced = s ? s.to : null;
  dead.forEach(t => t.alive = false); DD = dead; NXT = discuss;
  G.cs = []; G.log.push({ k: "n", n: G.night, acts: A.map(a => ({ t: a.type, f: idx(a.from), r: a.from.role, to: idx(a.to), m: a.type == "investigate" ? side(a.to) == "mafia" : undefined })), dead: dead.map(p => idx(p)), sil: G.silenced ? idx(G.silenced) : -1, sons: G.cs });
  const w = win();
  setPh(dead.length ? "dead" : "day"); sfx(dead.length ? "death" : "dawn");
  if (dead.length) flash(); else burst("#e2b04a");
  show(`<div class="icon">${dead.length ? "💀" : "🌅"}</div><h1 class="${dead.length ? "shake" : ""}">طلع الفجر</h1>
    ${dead.length ? dead.map(t => `<div class="dcard"><p>${deathLine(t.name, why[idx(t)], i => G.p[i].name)}${rv(t)}</p></div>`).join("") : '<div class="dcard ok"><p>مرّت الليلة ولم يمت أحد.</p></div>'}
    ${G.silenced && G.silenced.alive ? `<div class="dcard sil"><p><b>${G.silenced.name}</b> صامت اليوم. يستطيع التصويت لكن لا يتكلم.</p></div>` : ""}
    ${btn("متابعة", "after()", "go")}`);
}

/* ---------- day: discussion + vote ---------- */
function discuss() {
  let t = CFG.discuss;
  setPh("day");
  show(`<div class="icon">☀️</div><h2>النقاش</h2><div class="big" id="t"></div><p class="dim c">${G.silenced && G.silenced.alive ? "🤐 " + G.silenced.name + " صامت اليوم" : ""}</p>${btn("انتقل إلى التصويت", "vote(0)", "go")}`);
  setBar(barOff());
  const f = () => $("t").textContent = Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0");
  f(); T = setInterval(() => { t--; f(); $("t").classList.toggle("hot", t <= 10); if (t <= 10) sfx("tick"); if (t <= 0) vote(0); }, 1000);
}
function vote(i) {
  if (i == 0) { G.vq = alive(); G.tally = {}; G.vlog = []; }
  if (i >= G.vq.length) return tally();
  const v = G.vq[i];
  pass(v, () => {
    const m = v.role == "mayor" && !G.mayorUsed;
    show(`<h2>صوّت لإعدام من؟</h2>
      ${m ? `<label class="opt"><input type="checkbox" id="m"> فعّل صوت العمدة: يُحسب بثلاثة أصوات، مرة واحدة فقط</label>` : ""}
      <div class="list">${alive().filter(x => x !== v).map(t => pbtn(t.name, `cast(${i},${idx(t)})`)).join("")}${btn("امتنع عن التصويت", `cast(${i},-1)`)}</div>`);
  });
}
function cast(i, ti) {
  sfx("knock");
  let w = 1; if (ti >= 0) { const m = $("m") && $("m").checked; if (m) G.mayorUsed = true; w = m ? 3 : 1; G.tally[ti] = (G.tally[ti] || 0) + w; }
  G.vlog.push({ f: idx(G.vq[i]), t: ti, w });
  vote(i + 1);
}
function tally() {
  const e = Object.entries(G.tally), mx = Math.max(0, ...e.map(x => x[1])), top = e.filter(x => x[1] == mx);
  let msg = "<p>تعادلت الأصوات. لا أحد يُعدم اليوم.</p>"; DD = []; NXT = night; JW = null;
  if (mx > 0 && top.length == 1) { const x = G.p[top[0][0]]; x.alive = false; DD = [x]; if (x.role == "jester") JW = x; msg = `<p>أُعدم <b>${x.name}</b>.${rv(x)}</p>`; }
  const w = win(), hit = mx > 0 && top.length == 1; G.cs = []; G.log.push({ k: "v", n: G.night, votes: G.vlog, ex: hit ? idx(DD[0]) : -1, sons: G.cs });
  if (hit) { sfx("gavel"); flash(); }
  show(`<div class="icon">⚖️</div><h2>نتيجة التصويت</h2>${msg}${vlHtml(G.vlog, i => G.p[i].name)}${btn("متابعة", JW ? "over('jester')" : "after()", "go")}`);
}

/* ---------- spoiled son ---------- */
let DD = [], SD, NXT, JW, SEL = {};
function sons(dead, done) {
  const s = dead.find(p => p.role == "spoiledson" && !p.used);
  if (!s || !alive().length) return done();
  s.used = true; SD = { dead, done };
  pass(s, () => show(`<h2>${s.name}</h2><p>أنت الابن المدلل وقد متّ. اختر لاعبًا تشك فيه ليموت معك.</p><div class="list">${alive().map(t => btn(t.name, `sonHit(${idx(s)},${idx(t)})`)).join("")}</div>`));
}
function sonHit(si, ti) {
  const s = G.p[si], t = G.p[ti]; t.alive = false; SD.dead.push(t); G.cs.push([si, ti]); sfx("death"); flash();
  show(`<div class="icon">💀</div><p>أخذ <b>${s.name}</b> معه <b>${t.name}</b>.${rv(t)}</p>${btn("متابعة", "sons(SD.dead,SD.done)", "go")}`);
}
function after() { sons(DD, () => { const w = win(); w ? over(w) : NXT(); }); }

const THEMES = [["noir", "ليلي", "#e2b04a"], ["crimson", "قرمزي", "#e0605a"], ["emerald", "زمردي", "#4fd19a"], ["royal", "ملكي", "#7aa7ff"]];
function setPref(k, v) { PREF[k] = v; try { localStorage.setItem("mfp", JSON.stringify(PREF)); } catch (e) {} applyPref(); if (k == "vib" && v) try { navigator.vibrate && navigator.vibrate(40); } catch (e) {} settings(); }

      else if (s.dual) h = `<div class="icon">🔪</div><h2>${rl.n}</h2><p>2) من تريد قتله؟</p><div class="list">${mpTl(s, s.opts2, i => `mpD2(${i})`, true, null)}</div><div class="big" id="t"></div>`;
      else
      h = `<div class="icon">🌙</div><h2>${rl.n}</h2><p>${a.q}</p><div class="list">${mpTl(s, s.opts, i => `SEND({t:'act',target:${i}})`, a.type == "kill", a)}${s.skip ? btn("لن أطلق الليلة", "SEND({t:'act',target:-1})") : ""}</div><div class="big" id="t"></div>`;
    }
  } else if (ph == "son") {
    setPh("dead");
    h = s.opts ? `<h2>${rl.n}</h2><p>متّ! اختر لاعبًا تشك فيه ليموت معك.</p><div class="list">${s.opts.map(i => pbtn(pn(i), `SEND({t:'son',target:${i}})`)).join("")}</div><div class="big" id="t"></div>`
      : `<div class="icon">👦</div><h2>الابن المدلل يختار من يأخذه معه...</h2><div class="big" id="t"></div>`;
  } else if (ph == "dawn") {
    const R = s.rep, d = R.dead.length; setPh(d ? "dead" : "day");
    if (ch) { sfx(d ? "death" : "dawn"); d ? flash() : burst("#e2b04a"); }
    h = `<div class="icon">${d ? "💀" : "🌅"}</div><h1 class="${d ? "shake" : ""}">طلع الفجر</h1>
      ${d ? R.dead.map(i => `<p>${deathLine(pn(i), (R.why || {})[i], pn)}${rvm(i)}</p>`).join("") : "<p>مرّت الليلة ولم يمت أحد.</p>"}${sonsH()}
      ${R.sil >= 0 ? `<p><b>${pn(R.sil)}</b> صامت اليوم.</p>` : ""}`;
  } else if (ph == "day") {
    setPh("day");
    h = `<div class="icon">☀️</div><h2>النقاش</h2><div class="big" id="t"></div>${s.sil ? '<p class="bad">أنت مُسكَت اليوم.</p>' : ""}${chatBox()}<div id="mr">${muteRow()}</div>
      ${s.alive ? btn(s.done ? `بانتظار الباقين ${s.cnt.join("/")}` : "جاهز للتصويت", "SEND({t:'ready'})", "go").replace("<button", '<button id="rd"') : ""}`;
  } else if (ph == "vote") {
    setPh("day");
    if (!s.alive) h = watch("🗳️", "التصويت", "أنت خارج اللعبة وتشاهد.");
    else if (s.done) h = `<div class="icon">🗳️</div><h2>تم التصويت</h2><p class="dim">بانتظار الباقين ${s.cnt.join("/")}</p><div class="big" id="t"></div>`;
    else h = `<h2>صوّت لإعدام من؟</h2>${s.mayor ? '<label class="opt"><input type="checkbox" id="m"> فعّل صوت العمدة: ثلاثة أصوات، مرة واحدة فقط</label>' : ""}
      <div class="list">${s.opts.map(i => pbtn(pn(i), `mpVote(${i})`)).join("")}${btn("امتنع عن التصويت", "mpVote(-1)")}</div><div class="big" id="t"></div>`;
  } else if (ph == "result") {
    const x = s.res.ex; setPh("day"); if (ch && x >= 0) { sfx("gavel"); flash(); }
    h = `<div class="icon">⚖️</div><h2>نتيجة التصويت</h2>${x >= 0 ? `<p>أُعدم <b>${pn(x)}</b>.${rvm(x)}</p>` : "<p>لا أحد يُعدم اليوم.</p>"}${vlHtml(s.res.votes, pn)}${sonsH()}`;
  } else if (ph == "over") {
    const w = s.win, g = w != "mafia", E = { good: ["🏆", "فازت المدينة"], mafia: ["🕶️", "فازت المافيا"], jester: ["🤡", "فاز المهرّج"], draw: ["🤝", "تعادل: فناء الطرفين معًا"] }[w];
    setPh(w == "draw" ? "night" : g ? "day" : "dead"); if (ch) { sfx(w == "draw" ? "gavel" : g ? "win" : "lose"); burst(w == "draw" ? "#7c8590" : g ? "#e2b04a" : "#b5443f"); }
    h = `<div class="icon">${E[0]}</div><h1>${E[1]}</h1><div class="list">${s.players.map(p => `<p class="${p.a ? "" : "dim"}">${esc(p.n)}: ${ROLES[p.r].n}${p.k ? " (طُرد)" : p.a ? "" : " (خرج)"}</p>`).join("")}</div>
      ${tlHtml(s.log, i => pn(i))}${chatBox()}${s.host ? btn("لعبة جديدة بنفس اللاعبين", "SEND({t:'again'})", "go") : ""}${btn("خروج", "mpLeave()")}`;
  }
  const key = ph == "over" || ph == "lobby"; if (key) h += badge();
  show(h, !ch, key); clock(); if (ph == "day") setBar(barMp());
}

/* ---------- role icons (shown everywhere the role name appears) ---------- */
const IC = { killer:"🔪", silencer:"🤐", doctor:"💉", detective:"🔍", mayor:"🎩", citizen:"🧑", bodyguard:"🛡️", spoiledson:"👦", jester:"🃏", sniper:"🎯" };
Object.entries(IC).forEach(([id, ic]) => ROLES[id].n = ic + " " + ROLES[id].n);

/* ---------- atmosphere: rain + lightning at night, dust by day, ash after a death ---------- */
SFX.thunder = () => noise(1.6, 220, .25);
const cv = $("bg"), cx = cv.getContext("2d"); let W, H, lit = 0;
const rs = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; }; addEventListener("resize", rs); rs();
const mk = () => ({ x: Math.random() * W, y: Math.random() * H, v: 6 + Math.random() * 10, l: 10 + Math.random() * 18, s: Math.random() });
const P = Array.from({ length: 110 }, mk);
function loop() {
  cx.clearRect(0, 0, W, H);
  const ph = document.body.dataset.ph || "night";
  if (ph == "night") {
    cx.strokeStyle = "rgba(170,190,230,.28)"; cx.beginPath();
    P.forEach(p => { cx.moveTo(p.x, p.y); cx.lineTo(p.x - 3, p.y + p.l); p.y += p.v; p.x -= 1.2; if (p.y > H) Object.assign(p, mk(), { y: -20 }); });
    cx.stroke();
    if (Math.random() < .003) { lit = 1; sfx("thunder"); }
  } else {
    cx.fillStyle = ph == "day" ? "#e2b04a" : "#b5443f";
    P.forEach(p => {
      cx.globalAlpha = .2 + p.s * .5; cx.beginPath(); cx.arc(p.x, p.y, 1 + p.s * 2, 0, 7); cx.fill();
      p.y += ph == "day" ? -.3 - p.s * .4 : .6 + p.s; p.x += Math.sin(p.y / 40 + p.s * 9) * .4;
      if (p.y < -10 || p.y > H + 10) Object.assign(p, mk(), { y: ph == "day" ? H + 5 : -5 });
    });
    cx.globalAlpha = 1;
  }
  if (lit > 0) { cx.fillStyle = `rgba(200,215,255,${lit * .22})`; cx.fillRect(0, 0, W, H); lit -= .05; }
  requestAnimationFrame(loop);
}
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) loop();

/* ---------- phone/laptop comfort: screen stays on, Enter key continues ---------- */
let WL; const wake = () => { try { navigator.wakeLock.request("screen").then(l => WL = l).catch(() => {}); } catch (e) {} };
document.addEventListener("click", wake, { once: true });
document.addEventListener("visibilitychange", () => { if (document.visibilityState == "visible" && WL) wake(); });
function netUi() {
  const b = $("mpbtn"); if (!b) return;
  const off = !navigator.onLine, ok = !off && window.MP;
  b.textContent = tr(off ? "اتصل بالإنترنت" : window.MP ? "لعب جماعي" : "لعب جماعي · قريبًا");
  b.disabled = !ok; b.classList.toggle("go", !!ok);
}
function loadMP() { /* a page opened offline can enable multiplayer once the network is back */
  if (window.MP) return netUi();
  const sc = document.createElement("script"); sc.src = "mp-config.js?" + Date.now(); sc.onload = sc.onerror = netUi; document.head.appendChild(sc);
}
addEventListener("online", () => { netUi(); loadMP(); }); addEventListener("offline", netUi);
applyPref();
document.addEventListener("keydown", e => {
  if (e.key == "Enter" && !/INPUT|BUTTON|TEXTAREA/.test(document.activeElement.tagName)) { const b = document.querySelector(".go:not([disabled])"); b && b.click(); }
});

menu();
if (window.MP && mpSaved() && hbAge() > 6000) mpConnect(); /* auto-rejoin unless another tab of this browser is already in the game */
</script>
