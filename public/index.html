/* ===== visual polish v2 ===== */

const roleCard = (id, sd, n, desc) => { const ic = (String(n).match(/^\S+/) || ["🎭"])[0], nm = String(n).replace(/^\S+\s*/, "");
  return `<p class="dim c">اضغط على البطاقة لكشف دورك</p><div class="flip" onclick="flipCard(this)"><div class="fin"><div class="face back"><div class="sig">☪</div></div><div class="face front ${sd}"><div class="aura"></div><img class="art" src="roles/${id}.webp" alt="" onerror="this.remove()"><div class="ico">${ic}</div><h2>${nm}</h2><p class="sd">${SDTXT[sd]}</p><p class="dim">${desc || ""}</p></div></div></div>`; };
const hue = n => { let h = 0; for (const c of String(n)) h = (h * 31 + c.codePointAt(0)) % 360; return h; };
const ini = n => Array.from(String(n).replace(/&[a-z#0-9]+;/gi, "?").trim())[0] || "?";
const pat = n => ` data-i="${ini(n)}" style="--h:${hue(n)}"`;
const pbtn = (name, fn, cls = "") => btn(name, fn, ("pc " + cls).trim()).replace(/(<button class="[^"]*")/, (m) => m + pat(name));
const tgtBtn = (x, a, fn, p) => a.noRepeat && x === G.last[a.type] ? `<button class="btn pc off" disabled${pat(x.name)}>${x.name} (${a.type == "guard" ? "حُمي" : "أُنقذ"} الليلة الماضية)</button>`
  : a.type == "silence" && p && x !== p && side(x) == "mafia" && side(p) == "mafia" ? pbtn(`${x.name} — ${ROLES[x.role].n} (زميلك)`, fn, "warn")
  : a.type == "kill" && side(x) == "mafia" ? `<button class="btn pc foe" disabled${pat(x.name)}>${x.name} — ${ROLES[x.role].n} (زميلك)</button>` : pbtn(x.name, fn);
const deathLine = (n, cs, nm) => { /* cause of death sentence */
  if (PREF.lang == "en") {
    if (!cs || !cs.length) return `<b>${n}</b> was killed.`;
    const g = c => c.c == "kill" ? `by ${ROLES[c.by].n}` : c.c == "snipe" ? "by the Sniper's bullet" : c.c == "guard" ? `while protecting <b>${nm(c.f)}</b> from ${ROLES[c.by].n}` : `after missing their target <b>${nm(c.f)}</b>`;
    return `${cs.some(c => c.c != "miss") ? `<b>${n}</b> was killed` : `The Sniper <b>${n}</b> died`} ${cs.map(g).join(" and ")}.`;
  }
  if (!cs || !cs.length) return `قُتل <b>${n}</b>.`;
  const f = c => c.c == "kill" ? `على يد ${ROLES[c.by].n}` : c.c == "snipe" ? "برصاصة القناص" : c.c == "guard" ? `وهو يحمي <b>${nm(c.f)}</b> من ${ROLES[c.by].n}` : `بعد أن أخطأ هدفه <b>${nm(c.f)}</b>`;
  return `${cs.some(c => c.c != "miss") ? "قُتل" : "مات القناص"} <b>${n}</b> ${cs.map(f).join(" و")}.`;
};
const btn = (label, fn, cls = "") => `<button class="btn ${cls}" onclick="${fn}">${label}</button>`;

/* ---------- setup ---------- */

  <div class="row">${btn("−", "N=Math.max(5,N-1);setup()", "step")}<div class="big" style="flex:1">${N}</div>${btn("+", "N=Math.min(20,N+1);setup()", "step")}</div>
  <div>${Array.from({length:N}, (_, i) => `<input type="text" maxlength="14" placeholder="لاعب ${i+1}" value="${NAMES[i] || ""}" oninput="NAMES[${i}]=this.value">`).join("")}</div>
  ${btn("التالي: اختيار الشخصيات", "chooseRoles(true)", "go")}${btn("رجوع", "mode()")}`);
}

    <h3>الهدف</h3>
    <p>تفوز المدينة عندما يخرج كل أفراد المافيا من اللعبة. وتفوز المافيا عندما يتساوى عددها مع عدد أهل المدينة أو يزيد عليه. وإذا فني الطرفان معًا (كالابن المدلل يأخذ آخر مافيا معه) تكون النتيجة تعادلًا.</p>
    <h3>كيف تسير الجولة</h3>
    <p><b>الليل:</b> يمرَّر الهاتف على كل لاعب حي بترتيب المقاعد. كل لاعب يختار لاعبًا، حتى المواطن العادي، واختياره بلا أثر. هكذا لا يعرف أحد من صاحب القدرة.</p>
    <p><b>الفجر:</b> تُعلن النتائج: من قُتل ويُكشف دوره للجميع، ومن أُسكت.</p>

    <p>من 5 إلى 20 لاعبًا. يزيد عدد المافيا مع العدد (حوالي الربع)، وفي الألعاب الكبيرة يُضاف محقق وطبيب ثانٍ. إذا كان في المافيا أكثر من قاتل فالقتل يتم بالأغلبية، وعند التعادل يُختار أحد الأهداف عشوائيًا.</p>
    <h3>أهل المدينة</h3>${roles("good")}

    <p>عند موت أي لاعب، قتلًا أو إعدامًا، يُكشف دوره للجميع.</p>

function start() {
  const tot = Object.values(SEL).reduce((a, b) => a + b, 0);
  if (tot > N) return chooseRoles();
  const roles = shuffle([...Object.entries(SEL).flatMap(([id, c]) => Array(c).fill(id)), ...Array(N - tot).fill("citizen")]);
  G = { p: roles.map((r, i) => ({ name: esc((NAMES[i] || "").trim() || "لاعب " + (i+1)), role: r, alive: true })),
        night: 0, last: {}, silenced: null, mayorUsed: false, log: [], cs: [], vlog: [], mc: [] };
  reveal(0);
}

/* ---------- role reveal ---------- */
function reveal(i) {
  if (i >= G.p.length) return night();
  const p = G.p[i];
  pass(p, () => {
    const mates = G.p.filter(x => x !== p && side(x) == "mafia");
    show(`${roleCard(p.role, side(p), ROLES[p.role].n, DESC[p.role])}
      <div id="mt" class="lockv">${side(p) == "mafia" && mates.length ? `<p>رفيقك: <b>${mates.map(m => m.name).join("، ")}</b></p>` : ""}</div>
      ${btn("أخفِ الدور ومرّر الهاتف", `reveal(${i+1})`).replace(/(<button class="[^"]*")/, '$1 id="hidebtn" disabled')}`);
  });
}

/* ---------- night ---------- */
function night() {
  G.night++; G.acts = [];
  G.q = alive(); /* seating order */
  setPh("night"); sfx("night");
  show(`<div class="icon">🌙</div><h1>الليل ${G.night}</h1><p>تغلق المدينة عينيها. المافيا وحدها تعرف من يمشي في الظلام.</p>${btn("ابدأ الليل", "nstep(0)", "go")}`);
}
function nstep(i) {
  if (i >= G.q.length) return dawn();
  pass(G.q[i], () => {
    const p = G.q[i]; let a = ROLES[p.role].act || DECOY; if (a.once && p.used) a = DECOY;
    const ts = alive().filter(x => a.self || x !== p); G.cur = p; MQ = qcOK(p);
    show(`<h2>${ROLES[p.role].n}</h2><p>${isDual(p) ? "مات القاتل: ستسكت لاعبًا ثم تقتل لاعبًا. " : ""}${a.q}</p><div class="list">${ts.map(t => tgtBtn(t, a, `pick(${i},${idx(t)})`, p)).join("")}${a.skip ? btn("لن أطلق الليلة", `pick(${i},-1)`) : ""}</div>`);
  });
}
function pick(i, ti) {
  const p = G.q[i], t = G.p[ti]; let a = ROLES[p.role].act || DECOY; if (a.once && p.used) a = DECOY;
  if (t) { if (a.once) p.used = true; G.acts.push({ type: a.type, from: p, to: t }); }
  if (t && isDual(p) && a.type == "silence") { MQ = qcOK(p); show(`<h2>${ROLES[p.role].n}</h2><p>ثانيًا: من تريد قتله؟</p><div class="list">${alive().filter(x => x !== p).map(x => tgtBtn(x, { type: "kill" }, `pick2(${i},${idx(x)})`, p)).join("")}</div>`); return; }
  const inv = a.type == "investigate"; sfx("knock"); MQ = qcOK(p);
  show(`<h2>${inv ? t.name : "تم"}</h2><p>${inv ? (side(t) == "mafia" ? '<b class="bad">من المافيا</b>' : "ليس من المافيا") : "تم تسجيل اختيارك."}</p>${btn("أخفِ الشاشة ومرّر الهاتف", `nstep(${i+1})`)}`);
}

function pick2(i, ti) {
  if (side(G.p[ti]) == "mafia") return; /* no friendly fire */
  G.acts.push({ type: "kill", from: G.q[i], to: G.p[ti] }); sfx("knock"); MQ = qcOK(G.q[i]);
  show(`<h2>تم</h2><p>تم تسجيل اختيارك.</p>${btn("أخفِ الشاشة ومرّر الهاتف", `nstep(${i+1})`)}`);
}
/* ---------- dawn ---------- */
function dawn() {
  const A = G.acts, saved = A.filter(a => a.type == "save").map(a => a.to);
  const c = {}; A.filter(a => a.type == "kill").forEach(a => c[idx(a.to)] = (c[idx(a.to)] || 0) + 1);
  const mx = Math.max(0, ...Object.values(c)), top = Object.keys(c).filter(k => c[k] == mx);
  const tgt = top.length ? G.p[shuffle(top)[0]] : null;
  const gd = tgt && A.find(a => a.type == "guard" && a.to === tgt);
  const dead = tgt && !saved.includes(tgt) ? [gd ? gd.from : tgt] : [], why = {}, W = (p, o) => (why[idx(p)] = why[idx(p)] || []).push(o);
  if (dead.length) { const ka = A.find(a => a.type == "kill" && a.to === tgt), by = ka ? ka.from.role : "killer"; if (gd) W(gd.from, { c: "guard", f: idx(tgt), by }); else W(tgt, { c: "kill", by }); }
  G.last = {}; ["save", "guard"].forEach(k => G.last[k] = (A.find(a => a.type == k) || {}).to || null);
  A.filter(a => a.type == "snipe").forEach(a => { dead.push(a.to); W(a.to, { c: "snipe" }); if (side(a.to) != "mafia") { dead.push(a.from); W(a.from, { c: "miss", f: idx(a.to) }); } });
  dead.splice(0, dead.length, ...new Set(dead));
  const s = A.find(a => a.type == "silence"); G.silenced = s ? s.to : null;
  dead.forEach(t => t.alive = false); DD = dead; NXT = discuss;
  G.cs = []; G.log.push({ k: "n", n: G.night, acts: A.map(a => ({ t: a.type, f: idx(a.from), r: a.from.role, to: idx(a.to), m: a.type == "investigate" ? side(a.to) == "mafia" : undefined })), dead: dead.map(p => idx(p)), sil: G.silenced ? idx(G.silenced) : -1, sons: G.cs });
  const w = win();
  setPh(dead.length ? "dead" : "day"); sfx(dead.length ? "death" : "dawn");
  if (dead.length) flash(); else burst("#e2b04a");
  show(`<div class="icon">${dead.length ? "💀" : "🌅"}</div><h1 class="${dead.length ? "shake" : ""}">طلع الفجر</h1>
    ${dead.length ? dead.map(t => `<div class="dcard"><p>${deathLine(t.name, why[idx(t)], i => G.p[i].name)}${rv(t)}</p></div>`).join("") : '<div class="dcard ok"><p>مرّت الليلة ولم يمت أحد.</p></div>'}
    ${G.silenced && G.silenced.alive ? `<div class="dcard sil"><p><b>${G.silenced.name}</b> صامت اليوم. يستطيع التصويت لكن لا يتكلم.</p></div>` : ""}
    ${btn("متابعة", "after()", "go")}`);
  sayHtml(document.querySelector("#app .wrap").innerHTML); /* announcer: "طلع الفجر…" and who died */
}

/* ---------- day: discussion + vote ---------- */
function discuss() {
  let t = CFG.discuss;
  setPh("day");
  show(`<div class="icon">☀️</div><h2>النقاش</h2><div class="big" id="t"></div><p class="dim c">${G.silenced && G.silenced.alive ? "🤐 " + G.silenced.name + " صامت اليوم" : ""}</p>${btn("انتقل إلى التصويت", "vote(0)", "go")}`);
  setBar(barOff());
  const f = () => $("t").textContent = Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0");
  f(); T = setInterval(() => { t--; f(); $("t").classList.toggle("hot", t <= 10); if (t <= 10) sfx("tick"); if (t <= 0) vote(0); }, 1000);
}
function vote(i) {
  if (i == 0) { G.vq = alive(); G.tally = {}; G.vlog = []; }
  if (i >= G.vq.length) return tally();
  const v = G.vq[i];
  pass(v, () => {
    const m = v.role == "mayor" && !G.mayorUsed;
    show(`<h2>صوّت لإعدام من؟</h2>
      ${m ? `<label class="opt"><input type="checkbox" id="m"> فعّل صوت العمدة: يُحسب بثلاثة أصوات، مرة واحدة فقط</label>` : ""}
      <div class="list">${alive().filter(x => x !== v).map(t => pbtn(t.name, `cast(${i},${idx(t)})`)).join("")}${btn("امتنع عن التصويت", `cast(${i},-1)`)}</div>`);
  });
}
function cast(i, ti) {
  sfx("knock");
  let w = 1; if (ti >= 0) { const m = $("m") && $("m").checked; if (m) G.mayorUsed = true; w = m ? 3 : 1; G.tally[ti] = (G.tally[ti] || 0) + w; }
  G.vlog.push({ f: idx(G.vq[i]), t: ti, w });
  vote(i + 1);
}
function tally() {
  const e = Object.entries(G.tally), mx = Math.max(0, ...e.map(x => x[1])), top = e.filter(x => x[1] == mx);
  let msg = "<p>تعادلت الأصوات. لا أحد يُعدم اليوم.</p>"; DD = []; NXT = night; JW = null;
  if (mx > 0 && top.length == 1) { const x = G.p[top[0][0]]; x.alive = false; DD = [x]; if (x.role == "jester") JW = x; msg = `<p>أُعدم <b>${x.name}</b>.${rv(x)}</p>`; }
  const w = win(), hit = mx > 0 && top.length == 1; G.cs = []; G.log.push({ k: "v", n: G.night, votes: G.vlog, ex: hit ? idx(DD[0]) : -1, sons: G.cs });
  if (hit) { sfx("gavel"); flash(); }
  show(`<div class="icon">⚖️</div><h2>نتيجة التصويت</h2>${msg}${vlHtml(G.vlog, i => G.p[i].name)}${btn("متابعة", JW ? "over('jester')" : "after()", "go")}`);
}

/* ---------- spoiled son ---------- */
let DD = [], SD, NXT, JW, SEL = {};
function sons(dead, done) {
  const s = dead.find(p => p.role == "spoiledson" && !p.used);
  if (!s || !alive().length) return done();
  s.used = true; SD = { dead, done };
  pass(s, () => show(`<h2>${s.name}</h2><p>أنت الابن المدلل وقد متّ. اختر لاعبًا تشك فيه ليموت معك.</p><div class="list">${alive().map(t => btn(t.name, `sonHit(${idx(s)},${idx(t)})`)).join("")}</div>`));
}
function sonHit(si, ti) {
  const s = G.p[si], t = G.p[ti]; t.alive = false; SD.dead.push(t); G.cs.push([si, ti]); sfx("death"); flash();
  show(`<div class="icon">💀</div><p>أخذ <b>${s.name}</b> معه <b>${t.name}</b>.${rv(t)}</p>${btn("متابعة", "sons(SD.dead,SD.done)", "go")}`);
}
function after() { sons(DD, () => { const w = win(); w ? over(w) : NXT(); }); }

    ${SKY}${sv ? btn("العودة إلى غرفتك (" + esc(sv.code) + ")", "mpResume()", "mi i-back go") : ""}${btn("لعب", "mode()", "mi i-play" + (sv ? "" : " go"))}${btn("دليل اللعبة", "guide()", "mi i-guide")}${btn("الشخصيات", "chars()", "mi i-roles")}${btn("الإحصائيات", "stats()", "mi i-stats")}${btn("الإعدادات", "settings()", "mi i-set")}${installBtn()}${badge()}`, false, true);
}
function mode() {
  show(`<h2>طريقة اللعب</h2>${btn("تمرير الهاتف", "setup()", "mi i-phone go")}
    <button class="btn mi i-globe" id="mpbtn" onclick="mpMenu()"></button>${btn("رجوع", "menu()")}`); netUi();
}
function chars() {
  const g = s => Object.entries(ROLES).filter(([, r]) => r.side == s).map(([id, r]) => `<div class="role ${s}"><b>${r.n}</b><p class="dim">${DESC[id] || ""}</p></div>`).join("");
  show(`<h2>الشخصيات</h2><h3>أهل المدينة</h3>${g("good")}<h3>المافيا</h3>${g("mafia")}<h3>محايد</h3>${g("neutral")}${btn("رجوع", "menu()", "go")}`);
}
const DEFQC = ["أنا أشك بالجميع", "لنهدأ الليلة", "اتبعوا قراري"];
let QCS; try { QCS = JSON.parse(localStorage.getItem("mfq")); } catch (e) {}
if (!Array.isArray(QCS)) QCS = DEFQC.slice();
const qcSave = () => { try { localStorage.setItem("mfq", JSON.stringify(QCS)); } catch (e) {} };
const qcEdit = (i, v) => { v = v.trim().slice(0, 40); if (v) QCS[i] = v; else QCS.splice(i, 1); qcSave(); settings(); };
const qcDel = i => { QCS.splice(i, 1); qcSave(); settings(); };
const qcAdd = () => { const v = ($("qcnew").value || "").trim().slice(0, 40); if (v && QCS.length < 8) { QCS.push(v); qcSave(); } settings(); };
const qcOK = p => side(p) == "mafia" && alive().filter(x => side(x) == "mafia").length >= 2;
function mqcSet(on) {
  let b = $("mqc"); if (!b) { b = document.createElement("button"); b.id = "mqc"; b.type = "button"; b.textContent = "💬"; b.onclick = qcOpen; document.body.append(b); }
  b.className = on ? "on" : ""; if (!on) qcClose(); else b.dataset.n = G && G.mc ? G.mc.filter(m => m.n === G.night).length : 0;
}
function qcClose() { const m = document.getElementById("mqm"); if (m && m.remove) m.remove(); }
const QACTS = [["kill", "اقتل هذا", "🔪"], ["accuse", "اتهم هذا اللاعب", "👉"], ["silence", "سكت هذا اللاعب", "🤐"], ["vote", "صوّتوا ضد هذا اللاعب", "🗳️"], ["spare", "لا تقتلوا هذا اللاعب", "🛡️"]];
let QA = "kill", QREF = () => {};
const qaIcon = t => { const a = QACTS.find(x => String(t).startsWith(x[1])); return a ? a[2] : "💬"; };
function qcSetA(a) { QA = a; QREF(); }
function qcBody(P, fnAct, fnCus) { /* action tabs + player chips + custom sentences (shared by local and online chat) */
  return `<div class="qtabs">${QACTS.map(([k, l, ic]) => `<button class="mini${QA == k ? " on" : ""}" onclick="qcSetA('${k}')">${ic} ${l}</button>`).join("")}</div>
